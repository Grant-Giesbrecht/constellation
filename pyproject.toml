[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation-core"
version = "0.0.0.dev0"
authors = [
  { name="Grant Giesbrecht", email="grant.giesbrecht@colorado.edu" },
]
description = "Modular instrument control and lab access via Python"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
	'numpy >= 1.0.0',
	'pyvisa >= 1.0.0',
	'pylogfile >= 0.3.0',
	'h5py >= 3.11.0',
	'colorama >= 0.4.0',
	'labmesh >= 0.0.0.dev0',
	'pyzmq >= 25',
	'tabulate >= 0.9.0',
	'stardust-tools >= 0.0.0.dev0',
	'pyvicp >= 1.0.0',
	'PyQt6 >= 6.4.0',
	'matplotlib >= 3.5.0',
	'PyYAML >= 6.0'
]
license = "BSD-2-Clause"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/Grant-Giesbrecht/constellation"
Issues = "https://github.com/Grant-Giesbrecht/constellation/issues"

# verification.yaml files sit beside the drivers they describe (see
# docs/hardware_verification.md), so they must ship with the package - a driver in another repo
# then carries its own records with no central registry to keep in sync. `assets` holds the GUI's
# indicator icons and needs the same treatment.
[tool.setuptools.package-data]
"constellation" = ["assets/*"]
"constellation.instrument_control.*.drivers" = ["verification.yaml"]
